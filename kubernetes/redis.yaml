apiVersion: apps/v1
kind: Deployment
metadata: 
  name: redis-deployment
  namespace: wanderlust
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      name: redis
      labels:
        app: redis
    spec: 
      containers:
        - name: redis
          image: redis
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: mongo-storage
              mountpath: /var/lib/redis/dump.rdb
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc

---
apiVersion: v1
kind: Service
metadata:
  namespace: wanderlust
  name: redis-service
spec:
  selector: 
    app: redis
  ports:
    - targetPort: 6379
      port: 6379
      protocol: TCP

