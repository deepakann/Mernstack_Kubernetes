apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: wanderlust
  name: mongo-deployment
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      name: mongo
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountpath: /data/db
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: momgo-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mango-service
  namespace: wanderlust
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
      protocol: tcp
  
  